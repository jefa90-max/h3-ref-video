<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="stylesheet" href="/static/vendor/plyr/plyr.css">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/vendor/plyr/plyr.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="H3"><span class="brand-mark">H3<span class="brand-dot"></span></span><span data-i18n="brandSubtitle"></span></a>
    <div class="header-tools"><span class="local-badge"><span></span><span data-i18n="localOnly"></span></span><select id="language" data-i18n-aria="languageLabel"><option value="zh-CN" data-i18n="languageChinese"></option><option value="en" data-i18n="languageEnglish"></option></select></div>
  </header>
  <main class="shell">
    <section class="intro">
      <div><p class="eyebrow" data-i18n="eyebrow"></p><h1 data-i18n="title"></h1><p class="intro-copy" data-i18n="intro"></p></div>
      <div class="flow-line" aria-hidden="true"><span><b>01</b><span data-i18n="stepConfig"></span></span><i>→</i><span><b>02</b><span data-i18n="stepCreate"></span></span><i>→</i><span><b>03</b><span data-i18n="stepResult"></span></span></div>
    </section>

    <div id="global-error" class="notice error" role="alert" hidden></div>
    <div id="global-message" class="notice success" role="status" hidden></div>

    <details id="configuration" class="config-card">
      <summary><div class="config-heading"><span class="step-number">01</span><span data-i18n="configTitle"></span><span id="config-summary" class="subtle"></span></div><span class="details-action" data-i18n="configEdit"></span></summary>
      <div class="config-body">
        <p class="hint" data-i18n="configHint"></p>
        <div id="environment" class="environment"></div>
        <form id="config-form">
          <div class="config-grid">
            <label><span><span data-i18n="rhKey"></span> <span id="rh-key-status" class="key-state"></span></span><input id="rh-key" name="RUNNINGHUB_API_KEY" type="password" autocomplete="off" data-i18n-placeholder="keyPlaceholder"></label>
            <label><span><span data-i18n="apimartKey"></span> <span id="apimart-key-status" class="key-state"></span></span><input id="apimart-key" name="APIMART_API_KEY" type="password" autocomplete="off" data-i18n-placeholder="keyPlaceholder"></label>
            <label><span data-i18n="llmKey"></span><input id="llm-key" name="LLM_API_KEY" type="password" autocomplete="off" data-i18n-placeholder="llmKeyPlaceholder"><span id="llm-key-status" class="hint"></span></label>
            <label><span data-i18n="llmModel"></span><input id="llm-model" name="LLM_MODEL" spellcheck="false" required></label>
            <label class="wide"><span data-i18n="llmBase"></span><input id="llm-base" name="LLM_BASE_URL" type="url" spellcheck="false" required></label>
          </div>
          <label class="checkbox-field"><input id="persist-config" type="checkbox" checked><span data-i18n="persistConfig"></span></label>
          <p id="config-storage" class="hint"></p>
          <div class="config-footer"><span class="hint" data-i18n="rewriterHint"></span><div class="button-row"><button id="refresh-config" class="button secondary" type="button" data-i18n="refreshConfig"></button><button id="save-config" class="button" type="submit" data-i18n="saveConfig"></button></div></div>
        </form>
      </div>
    </details>

    <div class="workspace">
      <section class="editor-card panel">
        <div class="section-heading"><div><p class="eyebrow" data-i18n="createEyebrow"></p><h2 data-i18n="createTitle"></h2></div><span class="section-index">02</span></div>
        <div class="workflow-tabs" role="tablist" data-i18n-aria="workflowLabel"><button id="tab-one" type="button" role="tab" aria-selected="true" aria-controls="one-fields" class="active"><span data-i18n="oneTitle"></span><small data-i18n="oneTabHint"></small></button><button id="tab-film" type="button" role="tab" aria-selected="false" aria-controls="film-fields" tabindex="-1"><span data-i18n="filmTitle"></span><small data-i18n="filmTabHint"></small></button></div>
        <form id="job-form">
          <div id="one-fields" role="tabpanel" aria-labelledby="tab-one">
            <label><span class="label-heading"><span data-i18n="promptLabel"></span><span class="subtle" data-i18n="promptHint"></span></span><textarea id="prompt" rows="5" data-i18n-placeholder="promptPlaceholder"></textarea></label>
            <div class="field-grid">
              <label><span data-i18n="secondsLabel"></span><input id="seconds" type="number" min="5" max="15" step="1" value="12"></label>
              <label><span data-i18n="aspectLabel"></span><select id="aspect"><option value="9:16" data-i18n="aspectPortrait"></option><option value="16:9" data-i18n="aspectLandscape"></option><option value="1:1" data-i18n="aspectSquare"></option></select></label>
            </div>
            <div class="field-grid one-options"><label><span data-i18n="seedLabel"></span><input id="seed" type="number" step="1" data-i18n-placeholder="seedPlaceholder"></label><label class="checkbox-field"><input id="check-subtitles" type="checkbox"><span data-i18n="checkSubtitles"></span></label></div>
            <div class="field-block"><div class="label-heading"><span data-i18n="referencesLabel"></span><span id="image-count" class="subtle"></span></div><label class="upload-zone"><input id="one-upload" type="file" accept="image/png,image/jpeg,image/webp" multiple><span class="upload-symbol" aria-hidden="true">+</span><strong data-i18n="uploadReferences"></strong><span class="hint" data-i18n="uploadReferencesHint"></span></label><p class="hint" data-i18n="referenceOrder"></p><div id="reference-list" class="reference-list"></div></div>
          </div>

          <div id="film-fields" role="tabpanel" aria-labelledby="tab-film" hidden>
            <div class="label-heading"><label for="film-json" data-i18n="filmJsonLabel"></label><div class="button-row"><label class="button text-button file-button"><span data-i18n="importJson"></span><input id="film-import" type="file" accept=".json,application/json"></label><button id="reset-example" type="button" class="button text-button" data-i18n="resetExample"></button></div></div>
            <textarea id="film-json" class="json-editor" rows="12" spellcheck="false" aria-describedby="film-reference-hint film-parse-status"></textarea>
            <p id="film-reference-hint" class="hint" data-i18n="filmReferenceHint"></p>
            <p id="film-parse-status" class="hint" aria-live="polite"></p>
            <section class="film-reference-section" aria-labelledby="film-references-title"><h3 id="film-references-title" data-i18n="filmReferencesTitle"></h3><p class="hint" data-i18n="filmReferencesHint"></p><div id="film-reference-list"></div><p id="film-missing-references" class="hint" aria-live="polite"></p></section>
            <label id="demo-placeholders-field" class="checkbox-field"><input id="demo-placeholders" type="checkbox" checked><span data-i18n="demoPlaceholders"></span></label>
            <label><span data-i18n="frameMode"></span><select id="frames"><option value="shot" data-i18n="framesShot"></option><option value="first" data-i18n="framesFirst"></option><option value="none" data-i18n="framesNone"></option></select></label>
            <p id="frame-mode-hint" class="hint"></p>
          </div>

          <div class="output-field"><label><span class="label-heading"><span data-i18n="outputLabel"></span><span class="subtle" data-i18n="optional"></span></span><input id="output-dir" spellcheck="false" data-i18n-placeholder="outputPlaceholder"></label><p class="hint" data-i18n="outputHint"></p></div>
          <div class="run-settings"><div class="mode-heading"><span data-i18n="runMode"></span><div class="mode-toggle"><button id="mode-demo" type="button" aria-pressed="true" class="active" data-i18n="demoMode"></button><button id="mode-live" type="button" aria-pressed="false" data-i18n="liveMode"></button></div></div><p id="mode-hint" class="hint"></p></div>
          <div class="submit-row"><div class="button-row run-buttons"><button id="start-frames" class="button secondary" type="submit" hidden disabled></button><button id="start-job" class="button primary" type="submit" disabled><span id="start-label"></span><span aria-hidden="true">↗</span></button></div><span id="submit-hint" class="hint"></span></div>
        </form>
      </section>

      <aside class="monitor-column">
        <section class="monitor-card panel" aria-labelledby="monitor-title">
          <div class="section-heading"><div><p class="eyebrow" data-i18n="monitorEyebrow"></p><h2 id="monitor-title" data-i18n="monitorTitle"></h2></div><span id="job-status" class="status-badge idle"></span></div>
          <div id="monitor-empty" class="monitor-empty"><div class="frame-illustration" aria-hidden="true"><span></span><span></span><span></span><i>▶</i></div><h3 data-i18n="emptyTitle"></h3><p data-i18n="emptyHint"></p></div>
          <div id="job-detail" hidden>
            <div class="job-identity"><div><span id="job-kind" class="tag"></span><span id="job-mode" class="tag"></span><span id="job-operation" class="tag"></span></div><time id="job-created"></time></div>
            <div id="job-error" class="notice error" role="alert" hidden></div>
            <div class="progress-stats"><div><strong id="frames-count">0</strong><span data-i18n="framesComplete"></span></div><div><strong id="clips-count">0</strong><span data-i18n="clipsComplete"></span></div><div><strong id="files-count">0</strong><span data-i18n="artifactCount"></span></div></div>
            <p id="progress-note" class="hint"></p>
            <div class="path-display"><span data-i18n="jobOutput"></span><code id="job-output"></code></div>
            <div class="log-heading"><h3 data-i18n="logsTitle"></h3><span class="live-indicator" id="log-live" hidden><i></i><span data-i18n="liveLog"></span></span></div>
            <pre id="job-logs" class="log-output" tabindex="0"></pre>
            <button id="resume-job" type="button" class="button secondary resume-button" data-i18n="resumeJob" hidden></button>
            <p id="resume-hint" class="hint" data-i18n="resumeHint" hidden></p>
            <div id="storyboard-section" class="storyboard-section" hidden><div class="log-heading"><h3 data-i18n="storyboardTitle"></h3><span class="hint" data-i18n="storyboardPromptKind"></span></div><p class="hint" data-i18n="storyboardHint"></p><p class="hint" data-i18n="anchorHint"></p><div id="storyboard-cards"></div></div>
            <p id="video-stale" class="notice warning" data-i18n="videoStale" hidden></p>
            <div id="continue-section" class="continue-section" hidden><button id="continue-job" type="button" class="button"></button><p id="continue-hint" class="hint"></p></div>
            <div id="artifact-section" hidden><div class="log-heading"><h3 data-i18n="artifactsTitle"></h3><span class="hint" data-i18n="artifactsHint"></span></div><div id="artifacts" class="artifacts"></div></div>
            <details id="report-section" class="report-section" hidden><summary data-i18n="reportTitle"></summary><pre id="job-report" tabindex="0"></pre></details>
          </div>
        </section>
        <section class="history-card panel"><div class="history-heading"><h3 data-i18n="historyTitle"></h3><button id="refresh-history" type="button" class="button text-button" data-i18n="refreshHistory"></button></div><p id="history-empty" class="hint" data-i18n="historyEmpty"></p><div id="history-list" class="history-list"></div></section>
        <p class="workspace-note" data-i18n="workspaceNote"></p>
      </aside>
    </div>
    <footer><span data-i18n="footer"></span><span data-i18n="footerTech"></span></footer>
  </main>
</body>
</html>
