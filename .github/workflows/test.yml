name: test
on: [push, pull_request]
jobs:
  offline:
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-web.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_results.js tests/test_frame_character_picker.js tests/test_video_segment_prompts.js
